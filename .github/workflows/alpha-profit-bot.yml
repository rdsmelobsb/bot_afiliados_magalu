# .github/workflows/alpha_profit_bot.yml

name: 'Alpha-Profit: Execução Automática (3x ao Dia)'

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions roda em UTC (Horário de Brasília é UTC-3):
    - cron: '0 13 * * *'  # 10:00 BRT (Manhã - Ofertas de Abertura)
    - cron: '0 18 * * *'  # 15:00 BRT (Tarde - Promoções Relâmpago)
    - cron: '0 23 * * *'  # 20:00 BRT (Noite - Pico de Vendas e Conversão)

jobs:
  run-alpha-profit-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: '1. Checkout do Repositório'
        uses: actions/checkout@v4

      - name: '2. Configurar Python 3.10'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: '3. Instalar Dependências'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 google-generativeai pillow tweepy edge-tts

      - name: '3.5. Restaurar Históricos (Anti-Repetição 72h + Métricas)'
        uses: actions/cache/restore@v4
        with:
          path: |
            historico_postados.json
            historico_metricas.json
          key: historico-bot-${{ github.run_id }}
          restore-keys: |
            historico-bot-
            historico-postados-

      - name: '4. Executar o Script (magalu_scrapper.py)'
        run: python magalu_scrapper.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      - name: '4.5. Salvar Históricos (Anti-Repetição + Métricas)'
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            historico_postados.json
            historico_metricas.json
          key: historico-bot-${{ github.run_id }}

      - name: '5. Salvar Artefatos (Dashboard HTML + Reels/Stories + Resultados)'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-profit-resultados
          path: |
            dashboard_acompanhamento.html
            historico_metricas.json
            media_output/
            produtos_extraidos.csv
            insumo_ia.json
            oportunidades_alpha_profit.json
          retention-days: 14 # Guarda o dashboard, Reels/Stories e resultados por 14 dias
