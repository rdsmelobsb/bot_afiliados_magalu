# .github/workflows/alpha-profit-bot.yml

name: 'Alpha-Profit: Execução Automática (3x ao Dia)'

on:
  workflow_dispatch:
    inputs:
      run_editorial:
        description: 'Forçar execução do bloco editorial RSS fora da janela das 15h BRT'
        required: false
        type: boolean
        default: false
  # Reativar após validação das 3 fases em produção (10h, 15h e 20h BRT):
  # schedule:
  #   - cron: '0 13,18,23 * * *'

jobs:
  run-alpha-profit-bot:
    runs-on: ubuntu-latest

    steps:
      - name: '1. Checkout do Repositório'
        uses: actions/checkout@v4

      - name: '2. Configurar Python 3.11'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: '2.5. Configurar Node.js 22 (HyperFrames Reels)'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: '3. Instalar Dependências (Python + ffmpeg + HyperFrames)'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 google-generativeai pillow tweepy edge-tts feedparser
          npm install -g hyperframes
          ffmpeg -version | head -n 1
          hyperframes --version || true

      - name: '3.4. Restaurar Banco SQLite (alpha_profit.db.gz) via GitHub Releases'
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO_OWNER_NAME }}
        run: |
          if [ -n "${DATA_REPO}" ] && [ -n "${GH_TOKEN}" ]; then
            if gh release download db-latest --repo "${DATA_REPO}" --pattern "alpha_profit.db.gz" --clobber; then
              gunzip -f alpha_profit.db.gz
              ls -lh alpha_profit.db
            else
              echo "ℹ️ Release db-latest ainda não encontrada em ${DATA_REPO} (1ª execução). Banco será criado do zero."
            fi
          else
            echo "⚠️ DATA_REPO_OWNER_NAME ou DATA_REPO_TOKEN não configurados. Pulando restauração via Releases."
          fi

      - name: '3.5. Restaurar Históricos (Anti-Repetição 72h + Radar Preços + Métricas)'
        uses: actions/cache/restore@v4
        with:
          path: |
            historico_postados.json
            historico_precos.json
            historico_metricas.json
          key: historico-bot-${{ github.run_id }}
          restore-keys: |
            historico-bot-
            historico-postados-

      - name: '3.6. Inicializar SQLite, Migrar JSONs Legados e Capturar Baseline'
        run: |
          python storage_db.py --init --migrate
          BASELINE=$(python storage_db.py --baseline)
          echo "DB_BASELINE=${BASELINE}" >> "$GITHUB_ENV"
          echo "📊 Baseline SQLite (historico_precos): ${BASELINE} linhas"

      - name: '4. Executar o Script (magalu_scrapper.py)'
        run: |
          if [ "${{ inputs.run_editorial }}" = "true" ]; then
            python magalu_scrapper.py --run-editorial
          else
            python magalu_scrapper.py
          fi
        env:
          EDITORIAL_ENABLED: 'true'
          EDITORIAL_TELEGRAM_ENABLED: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      - name: '4.5. Salvar Métricas do Dashboard'
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            historico_metricas.json
          key: historico-bot-${{ github.run_id }}

      - name: '4.6. Limpar (180d), Validar Integridade e Subir SQLite (Releases)'
        if: always()
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: ${{ vars.DATA_REPO_OWNER_NAME }}
        run: |
          python storage_db.py --cleanup --dias 180
          python storage_db.py --validate --baseline-count "${DB_BASELINE:-0}"
          gzip -c -9 alpha_profit.db > alpha_profit.db.gz
          ls -lh alpha_profit.db alpha_profit.db.gz

          if [ -n "${DATA_REPO}" ] && [ -n "${GH_TOKEN}" ]; then
            if ! gh release view db-latest --repo "${DATA_REPO}" >/dev/null 2>&1; then
              gh release create db-latest --repo "${DATA_REPO}" --title "Alpha-Profit SQLite (Latest)" --notes "Estado mais recente do banco SQLite alpha_profit.db.gz."
            fi
            gh release upload db-latest alpha_profit.db.gz --repo "${DATA_REPO}" --clobber
            echo "✅ Banco alpha_profit.db.gz publicado na release db-latest."

            DIA_SEMANA=$(TZ=America/Sao_Paulo date +%u)
            if [ "${DIA_SEMANA}" = "7" ]; then
              WEEK_TAG="backup-$(TZ=America/Sao_Paulo date +%G-W%V)"
              if ! gh release view "${WEEK_TAG}" --repo "${DATA_REPO}" >/dev/null 2>&1; then
                gh release create "${WEEK_TAG}" alpha_profit.db.gz --repo "${DATA_REPO}" --title "Backup Semanal ${WEEK_TAG}" --notes "Snapshot semanal automático do banco SQLite (domingo BRT)."
                echo "✅ Snapshot semanal idempotente criado: ${WEEK_TAG}"
              else
                echo "ℹ️ Snapshot semanal ${WEEK_TAG} já existe. Pulando criação duplicada."
              fi
            fi
          else
            echo "⚠️ DATA_REPO_OWNER_NAME ou DATA_REPO_TOKEN não configurados. Upload para Releases ignorado."
          fi

      - name: '4.7. Salvar Artefato de Backup SQLite (30 dias)'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-profit-db-backup
          path: alpha_profit.db.gz
          retention-days: 30
          if-no-files-found: warn

      - name: '5. Salvar Artefatos (Dashboard HTML + Reels/Stories + Resultados)'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-profit-resultados
          path: |
            dashboard_acompanhamento.html
            historico_metricas.json
            media_output/
            produtos_extraidos.csv
            insumo_ia.json
            oportunidades_alpha_profit.json
          retention-days: 14 # Guarda o dashboard, Reels/Stories e resultados por 14 dias
